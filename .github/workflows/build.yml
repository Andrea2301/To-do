name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore DoItNow.sln

      - name: Build
        run: dotnet build DoItNow.sln --no-restore -c Release -m:1

      - name: Test
        run: dotnet test DoItNow.Tests/DoItNow.Tests.csproj --no-build --no-restore -c Release -m:1 --logger "console;verbosity=normal"
